# Keeps the Supabase (free plan) project from being paused for inactivity by
# running a small read query once a day. The workshop page also has a bundled
# content fallback, so this is a second line of defence, not the only one.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  the public anon key (same as VITE_SUPABASE_ANON_KEY)
#
# Note: GitHub disables scheduled workflows in public repos after 60 days with
# no repository activity. If that happens, re-enable it from the Actions tab.

name: Supabase keep-alive

on:
  schedule:
    # Daily at 03:17 UTC (11:17 WITA). Off the hour to avoid GitHub's busiest slot.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          # Retries cover the first request waking a slow instance.
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            --request POST "${SUPABASE_URL%/}/rest/v1/rpc/get_inner_compass_content" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header 'Content-Type: application/json' \
            --data '{}')

          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase keep-alive query failed (HTTP $status). The project may be paused; restore it from the Supabase dashboard."
            exit 1
          fi

          if [ "$(wc -c < response.json)" -lt 10 ]; then
            echo "::error::Supabase returned empty content."
            exit 1
          fi
